[package]
name = "synccloud"
version = "0.1.0"
description = "SyncCloud - 多后端文件同步桌面应用"
authors = ["SyncCloud"]
edition = "2021"

[lib]
name = "synccloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 数据库与状态
rusqlite = { version = "0.32", features = ["bundled"] }

# 文件系统
walkdir = "2"
notify = "8"
dirs = "6"

# 哈希
twox-hash = { version = "2", features = ["xxhash3_128"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 匹配规则
globset = "0.4"

# S3 后端
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-smithy-types = "1"
aws-credential-types = "1"

# WebDAV / 云盘 HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
quick-xml = "0.36"
url = "2"
percent-encoding = "2"

# 加密（客户端零知识加密）
chacha20poly1305 = { version = "0.10", features = ["stream", "std", "alloc"] }
generic-array = "0.14"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
base64 = "0.22"

# 凭据管理（Windows 凭据管理器）
keyring = { version = "3", features = ["windows-native"] }

# 日志与错误
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
